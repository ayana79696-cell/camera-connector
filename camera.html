<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Setup</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><div class="top"><div class="title">CAMERA CONNECTOR</div><a class="button" href="index.html">Home</a></div><section class="hero"><h2>Add Camera</h2><p class="muted">Choose the camera slot, video quality and how this phone should be displayed.</p><div class="controls"><select id="slot"><option value="1">Camera 1</option><option value="2">Camera 2</option></select><select id="resolution"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K (if supported)</option></select><select id="orientation"><option value="portrait">Portrait</option><option value="landscape" selected>Landscape</option></select><button class="button active" id="start">Start Camera</button></div><div class="controls"><button class="button" id="flip">Flip Camera</button><button class="button" id="stop">Stop</button><button class="button" id="fullscreen">Fullscreen</button></div></section><div class="card"><div class="preview" id="stage"><video id="preview" autoplay muted playsinline></video><div class="badge" id="label">CAMERA 1 • OFFLINE</div></div><div class="body"><div class="row"><span class="muted">Connection ID</span><span class="url" id="peerId">Starting…</span></div><p class="muted">Camera can remain in portrait or landscape. Landscape is recommended for livestreaming.</p></div></div></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>let stream=null,peer=null,front=false;const $=id=>document.getElementById(id);peer=new Peer();peer.on('open',id=>$('peerId').textContent=id);peer.on('connection',c=>{c.on('data',d=>{if(d.type==='request-stream'&&stream){c.send({type:'camera-stream-ready',slot:d.slot});const call=peer.call(d.controllerId,stream);call.on('error',()=>{})}})});function applyOrientation(){document.body.classList.toggle('landscape-mode',$('orientation').value==='landscape')}async function start(){try{applyOrientation();if(stream)stream.getTracks().forEach(t=>t.stop());const [w,h]=$('resolution').value.split('x').map(Number);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:w},height:{ideal:h}},audio:false});$('preview').srcObject=stream;$('label').textContent='CAMERA '+$('slot').value+' • READY';}catch(e){alert('Camera access failed: '+e.message)}}$('orientation').onchange=applyOrientation;$('start').onclick=start;$('flip').onclick=()=>{front=!front;start()};$('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());$('preview').srcObject=null;$('label').textContent='CAMERA '+$('slot').value+' • OFFLINE'};$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();applyOrientation();</script></body></html>
