<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Setup</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><div class="top"><div class="title">CAMERA CONNECTOR</div><a class="button" href="index.html">Home</a></div><section class="hero"><h2>Add Camera</h2><p class="muted">Choose the camera slot, video quality, orientation and zoom.</p><div class="controls"><select id="slot"><option value="1">Camera 1</option><option value="2">Camera 2</option></select><select id="resolution"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K (if supported)</option></select><select id="orientation"><option value="portrait">Portrait</option><option value="landscape" selected>Landscape</option></select><button class="button active" id="start">Start Camera</button></div><div class="controls"><button class="button" id="zoomOut">− Zoom</button><button class="button" id="zoomReset">100%</button><button class="button" id="zoomIn">+ Zoom</button><span class="muted" id="zoomStatus">Optical/digital zoom: 1.0×</span></div><div class="controls"><button class="button" id="flip">Flip Camera</button><button class="button" id="stop">Stop</button><button class="button" id="fullscreen">Fullscreen</button></div></section><div class="card"><div class="preview" id="stage"><video id="preview" autoplay muted playsinline></video><div class="badge" id="label">CAMERA 1 • OFFLINE</div></div><div class="body"><div class="row"><span class="muted">Connection ID</span><span class="url" id="peerId">Starting…</span></div><p class="muted" id="orientationStatus">Landscape mode selected.</p><p class="muted" id="networkStatus">Internet-ready WebRTC connection.</p></div></div></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>let stream=null,peer=null,front=false,zoom=1,zoomCaps=null;const $=id=>document.getElementById(id);peer=new Peer();peer.on('open',id=>$('peerId').textContent=id);peer.on('error',e=>$('networkStatus').textContent='Connection: '+(e?.type||'retrying'));peer.on('connection',c=>{c.on('data',d=>{if(d.type==='request-stream'&&stream){c.send({type:'camera-stream-ready',slot:d.slot});const call=peer.call(d.controllerId,stream,{metadata:{type:'camera',slot:d.slot}});tuneCall(call)}})});function tuneCall(call){call.on('error',()=>{});call.on('stream',()=>{});setTimeout(()=>{try{const pc=call.peerConnection;pc?.getSenders?.().forEach(s=>{if(s.track?.kind==='video'){const p=s.getParameters();p.encodings=p.encodings?.length?p.encodings:[{}];p.encodings[0].maxBitrate=2500000;p.encodings[0].maxFramerate=30;p.encodings[0].degradationPreference='maintain-framerate';s.setParameters(p).catch(()=>{})}})}catch(e){}},500)}async function applyOrientation(){const value=$('orientation').value;document.body.classList.toggle('landscape-mode',value==='landscape');document.body.classList.toggle('portrait-mode',value==='portrait');$('orientationStatus').textContent=value==='landscape'?'Landscape mode selected. Rotate the phone sideways for the camera feed.':'Portrait mode selected. Hold the phone upright.';try{if(screen.orientation?.lock){await screen.orientation.lock(value);}}catch(e){}}function updateZoomUI(){ $('zoomStatus').textContent='Optical/digital zoom: '+zoom.toFixed(1)+'×';$('zoomReset').textContent=Math.round(zoom*100)+'%';}async function applyZoom(){if(!stream)return;const track=stream.getVideoTracks()[0];if(!track)return;const caps=track.getCapabilities?.()||{};zoomCaps=caps.zoom;if(zoomCaps){const min=zoomCaps.min??1,max=zoomCaps.max??1,step=zoomCaps.step||0.1;zoom=Math.min(max,Math.max(min,zoom));zoom=Math.round(zoom/step)*step;try{await track.applyConstraints({advanced:[{zoom}]});}catch(e){}}else{$('preview').style.transform='scale('+zoom+')';}updateZoomUI();}async function start(){try{await applyOrientation();if(stream)stream.getTracks().forEach(t=>t.stop());const [w,h]=$('resolution').value.split('x').map(Number);const landscape=$('orientation').value==='landscape';const width=landscape?Math.max(w,h):Math.min(w,h);const height=landscape?Math.min(w,h):Math.max(w,h);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:width},height:{ideal:height},frameRate:{ideal:30,max:30}},audio:false});$('preview').srcObject=stream;zoom=1;await applyZoom();$('label').textContent='CAMERA '+$('slot').value+' • READY';$('networkStatus').textContent='Camera ready • WebRTC optimized for internet use';}catch(e){alert('Camera access failed: '+e.message)}}$('orientation').onchange=async()=>{await applyOrientation();if(stream)await start()};$('start').onclick=start;$('flip').onclick=()=>{front=!front;start()};$('zoomIn').onclick=()=>{zoom=Math.min(8,zoom+0.5);applyZoom()};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-0.5);applyZoom()};$('zoomReset').onclick=()=>{zoom=1;applyZoom()};$('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;$('label').textContent='CAMERA '+$('slot').value+' • OFFLINE';$('networkStatus').textContent='Camera stopped'};$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await applyOrientation()}catch(e){}};applyOrientation();updateZoomUI();</script></body></html>
