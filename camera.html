<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Setup</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><main class="app"><div class="top"><div class="title">CAMERA CONNECTOR</div><a class="button" href="index.html">Home</a></div><section class="hero"><h2>Connect this phone as a camera</h2><p class="muted">Keep both phones on the same network. Open this page on each camera phone.</p><div class="controls"><select id="slot"><option value="1">Camera 1</option><option value="2">Camera 2</option></select><select id="resolution"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K (if supported)</option></select><button class="button active" id="start">Start Camera</button></div></section><div class="card"><div class="preview"><video id="preview" autoplay muted playsinline></video><div class="badge" id="label">CAMERA 1 • OFFLINE</div></div><div class="body"><div class="row"><span class="muted">Connection ID</span><span class="url" id="peerId">Starting…</span></div><p class="muted">Give this camera's ID to the Switcher, or use the pairing flow there.</p><div class="controls"><button class="button" id="flip">Flip Camera</button><button class="button" id="stop">Stop</button></div></div></div></main><script>let stream=null,peer=null,front=true;const $=id=>document.getElementById(id);peer=new Peer();peer.on('open',id=>$('peerId').textContent=id);peer.on('call',call=>{if(stream)call.answer(stream);});$('slot').onchange=()=>{ $('label').textContent='CAMERA '+$('slot').value+' • OFFLINE';};async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());const [w,h]=$('resolution').value.split('x').map(Number);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:w},height:{ideal:h}},audio:false});$('preview').srcObject=stream;$('label').textContent='CAMERA '+$('slot').value+' • READY';}catch(e){alert('Camera access failed: '+e.message)}}$('start').onclick=start;$('flip').onclick=()=>{front=!front;start()};$('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());$('preview').srcObject=null;$('label').textContent='CAMERA '+$('slot').value+' • OFFLINE'};</script></body></html>
