<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Setup</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><div class="top"><div class="title">CAMERA CONNECTOR</div><a class="button" href="index.html">Home</a></div><section class="hero"><h2>Add Camera</h2><p class="muted">Choose the camera slot, video quality and how this phone should be displayed.</p><div class="controls"><select id="slot"><option value="1">Camera 1</option><option value="2">Camera 2</option></select><select id="resolution"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K (if supported)</option></select><select id="orientation"><option value="portrait">Portrait</option><option value="landscape" selected>Landscape</option></select><button class="button active" id="start">Start Camera</button></div><div class="controls"><button class="button" id="flip">Flip Camera</button><button class="button" id="stop">Stop</button><button class="button" id="fullscreen">Fullscreen</button></div></section><div class="card"><div class="preview" id="stage"><video id="preview" autoplay muted playsinline></video><div class="badge" id="label">CAMERA 1 • OFFLINE</div></div><div class="body"><div class="row"><span class="muted">Connection ID</span><span class="url" id="peerId">Starting…</span></div><p class="muted" id="orientationStatus">Landscape mode selected.</p></div></div></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>let stream=null,peer=null,front=false;const $=id=>document.getElementById(id);peer=new Peer();peer.on('open',id=>$('peerId').textContent=id);peer.on('connection',c=>{c.on('data',d=>{if(d.type==='request-stream'&&stream){c.send({type:'camera-stream-ready',slot:d.slot});const call=peer.call(d.controllerId,stream,{metadata:{type:'camera',slot:d.slot}});call.on('error',()=>{})}})});async function applyOrientation(){const value=$('orientation').value;document.body.classList.toggle('landscape-mode',value==='landscape');document.body.classList.toggle('portrait-mode',value==='portrait');$('orientationStatus').textContent=value==='landscape'?'Landscape mode selected. Rotate the phone sideways for the camera feed.':'Portrait mode selected. Hold the phone upright.';try{if(screen.orientation?.lock){await screen.orientation.lock(value);}}catch(e){/* Browser may require fullscreen before locking orientation. */}}async function start(){try{await applyOrientation();if(stream)stream.getTracks().forEach(t=>t.stop());const [w,h]=$('resolution').value.split('x').map(Number);const landscape=$('orientation').value==='landscape';const width=landscape?Math.max(w,h):Math.min(w,h);const height=landscape?Math.min(w,h):Math.max(w,h);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:width},height:{ideal:height}},audio:false});$('preview').srcObject=stream;$('label').textContent='CAMERA '+$('slot').value+' • READY';}catch(e){alert('Camera access failed: '+e.message)}}$('orientation').onchange=async()=>{await applyOrientation();if(stream)await start()};$('start').onclick=start;$('flip').onclick=()=>{front=!front;start()};$('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());$('preview').srcObject=null;$('label').textContent='CAMERA '+$('slot').value+' • OFFLINE'};$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await applyOrientation()}catch(e){}};applyOrientation();</script></body></html>
