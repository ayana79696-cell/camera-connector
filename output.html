<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Camera</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#aeb7c5;font:600 16px system-ui;background:#000}.hidden{display:none!important}</style><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script></head><body><video id="v" autoplay muted playsinline></video><div id="msg">Waiting for live feed…</div><script>const control=new URLSearchParams(location.search).get('control'),v=document.getElementById('v'),msg=document.getElementById('msg');let peer=new Peer(),controller,retryTimer;function connect(){if(!control)return msg.textContent='Missing connector';controller=peer.connect(control,{reliable:true});controller.on('open',()=>{msg.textContent='Waiting for live feed…';controller.send({type:'output'})});controller.on('data',d=>{if(d.type==='cameras'||d.type==='select')controller.send({type:'output'})});controller.on('close',()=>{msg.classList.remove('hidden');msg.textContent='Reconnecting…';clearTimeout(retryTimer);retryTimer=setTimeout(connect,1200)});controller.on('error',()=>{})}peer.on('open',connect);peer.on('call',call=>{call.answer();call.on('stream',s=>{v.srcObject=s;msg.classList.add('hidden');v.play().catch(()=>{})});call.on('error',()=>{msg.classList.remove('hidden');msg.textContent='Waiting for live feed…'})});peer.on('error',()=>{});</script></body></html>
