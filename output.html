<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Connector Output</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#aeb7c5;font:600 16px system-ui;background:#000}#live{position:fixed;top:12px;left:12px;padding:7px 10px;border-radius:8px;background:#090d14cc;color:#fff;font:700 12px system-ui}.red{color:#ff3658}</style><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><video id="v" autoplay muted playsinline></video><div id="msg">Waiting for Camera Connector…</div><div id="live" class="red">● CAMERA —</div><script>const p=new URLSearchParams(location.search),control=p.get('control');const v=document.getElementById('v'),msg=document.getElementById('msg'),live=document.getElementById('live');let ids={},selected=1,streams={};const peer=new Peer();peer.on('open',()=>{if(!control)return msg.textContent='Missing controller ID';const c=peer.connect(control);c.on('open',()=>c.send({type:'output'}));c.on('data',d=>{if(d.type==='cameras'){ids=d.ids||{};selected=d.selected||1;connectSelected();}if(d.type==='select'){selected=d.slot;connectSelected();}});});function connectSelected(){const id=ids[selected];if(!id){msg.textContent='Waiting for Camera '+selected;return}if(streams[selected]){v.srcObject=streams[selected];msg.style.display='none';live.textContent='● CAMERA '+selected+' LIVE';return}peer.call(id).on('stream',s=>{streams[selected]=s;v.srcObject=s;msg.style.display='none';live.textContent='● CAMERA '+selected+' LIVE'}).on('error',()=>msg.textContent='Camera '+selected+' disconnected')} </script></body></html>
