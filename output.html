<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Camera</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#aeb7c5;font:600 16px system-ui;background:#000}.hidden{display:none!important}</style><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><video id="v" autoplay muted playsinline></video><div id="msg">Waiting for live feed…</div><script>const control=new URLSearchParams(location.search).get('control'),v=document.getElementById('v'),msg=document.getElementById('msg');let peer=new Peer(),controller;peer.on('open',()=>{if(!control){msg.textContent='Missing connector';return}controller=peer.connect(control);controller.on('open',()=>controller.send({type:'output'}));controller.on('data',d=>{if(d.type==='cameras'||d.type==='select'){if(d.type==='select')controller.send({type:'output'});}});controller.on('error',()=>msg.textContent='Connection lost')});peer.on('call',call=>{call.answer();call.on('stream',s=>{v.srcObject=s;msg.classList.add('hidden');v.play().catch(()=>{})});call.on('error',()=>{msg.classList.remove('hidden');msg.textContent='Waiting for live feed…'})});</script></body></html>
