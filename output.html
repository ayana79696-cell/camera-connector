<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Connector Output</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#aeb7c5;font:600 16px system-ui;background:#000}#live{position:fixed;top:12px;left:12px;padding:7px 10px;border-radius:8px;background:#090d14cc;color:#fff;font:700 12px system-ui}.red{color:#ff3658}</style><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><video id="v" autoplay muted playsinline></video><div id="msg">Waiting for Camera Connector…</div><div id="live" class="red">● CAMERA —</div><script>const p=new URLSearchParams(location.search),control=p.get('control');const v=document.getElementById('v'),msg=document.getElementById('msg'),live=document.getElementById('live');let selected=1;let controller;const peer=new Peer();peer.on('open',()=>{if(!control){msg.textContent='Missing controller ID';return}controller=peer.connect(control);controller.on('open',()=>controller.send({type:'output'}));controller.on('data',d=>{if(d.type==='cameras'){selected=d.selected||1;requestSelected();}if(d.type==='select'){selected=d.slot;requestSelected();}});controller.on('error',()=>msg.textContent='Camera Connector connection failed')});function requestSelected(){if(!controller?.open)return;msg.textContent='Connecting Camera '+selected+'…';msg.style.display='grid';const call=peer.call(control,undefined,{metadata:{type:'output',slot:selected}});call.on('stream',s=>{v.srcObject=s;msg.style.display='none';live.textContent='● CAMERA '+selected+' LIVE'});call.on('error',()=>msg.textContent='Camera '+selected+' is not ready')} </script></body></html>
