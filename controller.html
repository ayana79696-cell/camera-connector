<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Switcher</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><div class="top"><div><div class="title">CAMERA SWITCHER</div><div class="status" id="status">Creating control channel…</div></div><a class="button" href="index.html">Home</a></div><section class="hero"><h2>Pair your camera phones</h2><p class="muted">Enter each camera phone's Connection ID. Phones can use Wi-Fi or mobile data.</p><div class="controls"><input id="id1" placeholder="Camera 1 ID"><button class="button" id="pair1">Pair Camera 1</button><input id="id2" placeholder="Camera 2 ID"><button class="button" id="pair2">Pair Camera 2</button></div><div class="controls"><button class="button active" id="go1">CAMERA 1 LIVE</button><button class="button" id="go2">CAMERA 2 LIVE</button></div><p class="muted" id="network">Internet mode: ready</p></section><div class="grid"><div class="card"><div class="preview"><video id="v1" autoplay muted playsinline></video><div class="badge">CAMERA 1</div></div><div class="body"><span class="muted" id="s1">Not connected</span></div></div><div class="card"><div class="preview"><video id="v2" autoplay muted playsinline></video><div class="badge">CAMERA 2</div></div><div class="body"><span class="muted" id="s2">Not connected</span></div></div></div><section class="hero wide"><h2>PRISM output</h2><p class="muted">Paste this URL into PRISM Live Studio → My Studio → Webpage.</p><input id="outputUrl" readonly style="width:100%;margin-top:8px"><div class="controls"><button class="button active" id="copy">Copy PRISM URL</button></div><div class="preview" style="margin-top:14px;border-radius:12px;overflow:hidden"><video id="out" autoplay muted playsinline></video></div></section></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>const $=id=>document.getElementById(id);let peer=null,selected=1,streams={1:null,2:null},cameraIds={1:'',2:''},outputs=[],pairTimers={};function initPeer(forceNew=false){const key='camera-connector-controller-id';const saved=forceNew?null:localStorage.getItem(key);peer=new Peer(saved||undefined,{debug:1});peer.on('open',id=>{localStorage.setItem(key,id);$('status').textContent='Switcher ready • ID '+id;$('outputUrl').value=location.origin+'/output.html?control='+encodeURIComponent(id);$('network').textContent='Internet mode: ready'});peer.on('error',e=>{if(e?.type==='unavailable-id'&&!forceNew){localStorage.removeItem(key);try{peer.destroy()}catch(_){ }initPeer(true);return;}$('network').textContent='Internet connection: '+(e?.type||'retrying')});peer.on('disconnected',()=>{ $('network').textContent='Signalling disconnected • reconnecting…';try{peer.reconnect()}catch(_){}});peer.on('call',call=>{call.answer();tuneCall(call);call.on('stream',s=>{const slot=Object.keys(cameraIds).find(k=>cameraIds[k]===call.peer)||selected;streams[slot]=s;$('v'+slot).srcObject=s;$('s'+slot).textContent='Connected • live';if(selected==slot){$('out').srcObject=s;broadcast()}})});peer.on('connection',c=>{outputs.push(c);c.on('open',()=>{try{c.send({type:'cameras',ids:cameraIds,selected})}catch(e){}sendStream(c)});c.on('data',d=>{if(d.type==='output')sendStream(c)});c.on('close',()=>outputs=outputs.filter(x=>x!==c))});}initPeer();function tuneCall(call){call.on('error',()=>{});setTimeout(()=>{try{const pc=call.peerConnection;pc?.getSenders?.().forEach(s=>{if(s.track?.kind==='video'){const p=s.getParameters();p.encodings=p.encodings?.length?p.encodings:[{}];p.encodings[0].maxBitrate=2500000;p.encodings[0].maxFramerate=30;p.encodings[0].degradationPreference='maintain-framerate';s.setParameters(p).catch(()=>{})}})}catch(e){}},500)}function sendStream(c){if(c&&c.open&&streams[selected]){const call=peer.call(c.peer,streams[selected],{metadata:{type:'live-output',slot:selected}});tuneCall(call)}}function broadcast(){outputs=outputs.filter(c=>c.open);outputs.forEach(c=>{try{c.send({type:'select',slot:selected})}catch(e){}sendStream(c)});$('out').srcObject=streams[selected]||null}function pair(slot){const id=$('id'+slot).value.trim();if(!id)return alert('Enter Camera '+slot+' ID');cameraIds[slot]=id;localStorage.setItem('cam'+slot,id);clearTimeout(pairTimers[slot]);let attempts=0;function attempt(){attempts++;$('s'+slot).textContent='Pairing… attempt '+attempts;const c=peer.connect(id,{reliable:true,metadata:{type:'camera-controller',slot}});let done=false;c.on('open',()=>{done=true;c.send({type:'request-stream',controllerId:peer.id,slot});$('s'+slot).textContent='Connected • requesting video…';$('network').textContent='Internet mode: camera '+slot+' found'});c.on('data',d=>{if(d.type==='camera-stream-ready'){$('s'+slot).textContent='Connected • live';$('network').textContent='Internet mode: camera '+slot+' connected';}});c.on('error',e=>{if(done)return;$('s'+slot).textContent=e?.type==='peer-unavailable'?'Camera '+slot+' ID is offline • retrying…':'Pairing failed • retrying…';if(attempts<10)pairTimers[slot]=setTimeout(attempt,1000)});c.on('close',()=>{if(done)$('s'+slot).textContent='Disconnected'});}attempt();}function select(n){selected=n;$('go1').classList.toggle('active',n===1);$('go2').classList.toggle('active',n===2);broadcast()}peer.on('call',call=>{call.answer();tuneCall(call);call.on('stream',s=>{const slot=Object.keys(cameraIds).find(k=>cameraIds[k]===call.peer)||selected;streams[slot]=s;$('v'+slot).srcObject=s;$('s'+slot).textContent='Connected • live';if(selected==slot){$('out').srcObject=s;broadcast()}})});peer.on('connection',c=>{outputs.push(c);c.on('open',()=>{try{c.send({type:'cameras',ids:cameraIds,selected})}catch(e){}sendStream(c)});c.on('data',d=>{if(d.type==='output')sendStream(c)});c.on('close',()=>outputs=outputs.filter(x=>x!==c))});$('pair1').onclick=()=>pair(1);$('pair2').onclick=()=>pair(2);$('go1').onclick=()=>select(1);$('go2').onclick=()=>select(2);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('outputUrl').value)}catch(e){$('outputUrl').select();document.execCommand('copy')}};$('id1').value=localStorage.getItem('cam1')||'';$('id2').value=localStorage.getItem('cam2')||'';</script></body></html>
